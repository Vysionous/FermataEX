pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'FermataEX'

gradle.ext.modules = []
gradle.ext.retiredProductionModules = []
gradle.ext.localProps = [:]
gradle.ext.enableGoogleServices = false
gradle.ext.abiFilters = ['arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64']
gradle.ext.releaseSigningConfigured = false

include ':app'
include ':utils'
project(':utils').projectDir = file('depends/utils')
